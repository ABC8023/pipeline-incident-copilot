[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pipeline-incident-copilot"
version = "0.1.0"
description = "Diagnose failed pipelines from logs, schema drift, and metric anomalies"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.138,<0.139",
  "uvicorn[standard]>=0.41,<0.42",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<0.29",
]

[project.scripts]
pipeline-copilot = "pipeline_copilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pipeline_copilot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.mypy]
mypy_path = "backend/src"

[tool.ruff]
line-length = 88
